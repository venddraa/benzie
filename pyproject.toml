[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "benzie"
version = "0.1.0.dev1"
description = "Asisten pribadi lokal — fondasi aplikasi desktop Benzie"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6>=6.8,<7"]

[project.scripts]
benzie = "benzie.app:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/benzie"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md", "/pyproject.toml", "/uv.lock", "/.python-version", "/.gitignore"]

[tool.uv]
python-downloads = "never"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
